name: Run build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Generate Markdown
        run: make markdown

      - name: Setup Images
        run: |
          mkdir -p public
          ln -sf ../img public/img

      - name: Build Astro
        run: npm run build

